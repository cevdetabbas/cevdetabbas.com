version: '3.8'
services:
  web:
    image: httpd:latest
    container_name: cevdetabbas.com
    ports:
      - "1880:80"
    volumes:
      - ./htdocs:/usr/local/apache2/htdocs/
    environment:
      - GIT_TOKEN=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
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y git &&
        while true; do
          git -C /usr/local/apache2 pull https://$GIT_TOKEN@github.com/username/repository.git;
          sleep 60;
        done
      "
    restart: always
